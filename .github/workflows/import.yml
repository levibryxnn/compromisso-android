name: COMPROMISSO Android CI
concurrency:
  group: compromisso-android-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Detect uploaded source ZIP
        id: source
        shell: bash
        run: |
          if [[ -f COMPROMISSO-Android-0.1.4-codigo-fonte.zip ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate and unpack the source archive
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil, stat
          root = Path.cwd().resolve()
          archive = root / 'COMPROMISSO-Android-0.1.4-codigo-fonte.zip'
          if not archive.is_file():
              raise RuntimeError('Upload the version 0.1.4 ZIP to the repository root first.')
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad: raise ValueError(f'Corrupt member: {bad}')
              for m in z.infolist():
                  name = m.filename
                  prefix = 'compromisso-android/'
                  if not name.startswith(prefix):
                      raise ValueError(f'Unexpected archive root: {name}')
                  relative = name[len(prefix):]
                  if not relative: continue
                  destination = (root / relative).resolve()
                  mode = (m.external_attr >> 16) & 0o170000
                  if not destination.is_relative_to(root) or mode == stat.S_IFLNK:
                      raise ValueError(f'Unsafe archive member: {name}')
                  if m.is_dir(): destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(m) as inp, destination.open('wb') as out:
                          shutil.copyfileobj(inp, out)
          assert (root / 'app/src/main/AndroidManifest.xml').is_file()
          assert (root / '.github/workflows/android.yml').is_file()
          PY
          python3 scripts/security_audit.py
      - name: Audit source permissions, manifest and sensitive APIs
        run: python3 scripts/security_audit.py
      - name: Publish imported source without changing workflow files
        if: steps.source.outputs.present == 'true' && github.event_name == 'push'
        run: |
          rm -f COMPROMISSO-Android-0.1.4-codigo-fonte.zip .github/workflows/android.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish COMPROMISSO Android 0.1.4 source [skip ci]'
          git push origin HEAD:main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 37.0 and Build Tools
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run JVM tests
        run: gradle testDebugUnitTest
      - name: Run Android Lint
        run: gradle lintDebug
      - name: Build Android APK
        run: gradle assembleDebug
      - name: Audit APK permissions
        run: python3 scripts/apk_permission_audit.py "$ANDROID_HOME/build-tools/36.0.0/aapt" app/build/outputs/apk/debug/app-debug.apk
      - name: Log reproducible APK digest
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: COMPROMISSO-0.1.5-debug-EXPERIMENTAL
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Compile minified release variant (unsigned)
        run: gradle assembleRelease
      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumented tests in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest
            mkdir -p preview-output
            adb pull /sdcard/Download/compromisso-home.png preview-output/compromisso-home.png
      - name: Upload real Android UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COMPROMISSO-0.1.5-real-UI-preview
          path: preview-output/compromisso-home.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COMPROMISSO-0.1.5-emulator-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
